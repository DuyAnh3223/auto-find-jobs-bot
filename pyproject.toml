[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["browser: local HTML fixture tests using installed Microsoft Edge"]

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["demo", ".tools", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
